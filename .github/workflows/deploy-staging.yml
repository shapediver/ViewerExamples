name: deploy-staging

on:
    push:
        branches:
            - development
    workflow_dispatch:

permissions:
    contents: read
    id-token: write

concurrency:
    group: viewer-examples-staging-${{ github.ref }}
    cancel-in-progress: true

jobs:
    deploy:
        runs-on: ubuntu-latest

        env:
            DEPLOY_ENV: staging

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 24.12.0
                  cache: npm

            - name: Install dependencies
              run: npm ci

            - name: Build
              run: npm run build

            - name: Configure AWS credentials
              uses: aws-actions/configure-aws-credentials@v4
              with:
                  role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
                  aws-region: us-east-1

            - name: Deploy to staging
              run: ts-node ./scripts/deploy.ts

            - name: Collect failure artifacts
              if: failure()
              shell: bash
              run: |
                  rm -rf .github-artifacts/failure
                  mkdir -p .github-artifacts/failure

                  if [[ -d dist ]]; then
                    cp -R dist .github-artifacts/failure/
                  fi

            - name: Upload failure artifacts
              if: failure()
              uses: actions/upload-artifact@v4
              with:
                  name: viewer-examples-staging-failure-artifacts
                  if-no-files-found: ignore
                  compression-level: 0
                  path: .github-artifacts/failure/
